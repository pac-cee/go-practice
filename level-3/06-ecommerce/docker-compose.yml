version: '3'
services:
  product-service:
    build: ./services/product
    ports:
      - "8081:8081"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=ecommerce
    depends_on:
      - mongodb

  order-service:
    build: ./services/order
    ports:
      - "8082:8082"
    environment:
      - MONGO_URI=mongodb://mongodb:27017
      - DB_NAME=ecommerce
